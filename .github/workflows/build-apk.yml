name: Build Android APK

# Manual dispatch only: builds the APK signed with the fixed keystore in
# signing/telahub-debug.keystore.b64 and publishes it to the apk-latest release.
# Pushes never overwrite apk-latest. release/telahub-2026-10-26.apk is kept as a backup.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Ensure ImageMagick
        run: command -v magick || command -v convert || (sudo apt-get update && sudo apt-get install -y imagemagick)

      - name: Add Android platform
        run: npx cap add android

      - name: Patch Android project
        run: node scripts/patch-android.mjs
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk telahub.apk

      - name: Verify signing certificate
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          echo "Using $APKSIGNER"
          OUT=$("$APKSIGNER" verify --print-certs -v telahub.apk)
          echo "$OUT"
          SHA=$(echo "$OUT" | grep -m1 -i "certificate SHA-256 digest" | sed 's/.*: *//' | tr -d ': ' | tr 'A-F' 'a-f')
          EXPECTED=2be553f9b6f4362eded6cf89bac4e0009d30531d3b04d85267c80532cb476778
          if [ "$SHA" != "$EXPECTED" ]; then
            echo "::error::APK signed with wrong certificate ($SHA), expected $EXPECTED"
            exit 1
          fi
          echo "Signing certificate OK"

      - uses: actions/upload-artifact@v4
        with:
          name: telahub-apk
          path: telahub.apk

      - name: Publish release apk-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          DATE=$(date -u +%d/%m/%Y)
          TITLE="TelaHUB APK $VERSION ($DATE)"
          NOTES="Versão $VERSION — build de $DATE"
          git tag -f apk-latest
          git push -f origin apk-latest
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest telahub.apk --clobber
            gh release edit apk-latest --title "$TITLE" --notes "$NOTES"
          else
            gh release create apk-latest telahub.apk --title "$TITLE" --notes "$NOTES" --latest
          fi
