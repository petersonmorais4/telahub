name: Build Android APK

# Pinned release: every push republishes the APK built on 2026-10-26 (build 35),
# kept in release/telahub-2026-10-26.apk, so /apk always serves that exact file.
# A fresh build only runs on manual dispatch and is uploaded as an artifact only.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  publish-pinned:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish release apk-latest (pinned 26/10 build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp release/telahub-2026-10-26.apk telahub.apk
          git tag -f apk-latest
          git push -f origin apk-latest
          NOTES="Versão 1.0.35 (build de 26/10/2026) — republicada"
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest telahub.apk --clobber
            gh release edit apk-latest --title "TelaHUB APK (build 35)" --notes "$NOTES"
          else
            gh release create apk-latest telahub.apk --title "TelaHUB APK (build 35)" --notes "$NOTES" --latest
          fi

  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Ensure ImageMagick
        run: command -v magick || command -v convert || (sudo apt-get update && sudo apt-get install -y imagemagick)

      - name: Add Android platform
        run: npx cap add android

      - name: Patch Android project
        run: node scripts/patch-android.mjs
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk telahub.apk

      - uses: actions/upload-artifact@v4
        with:
          name: telahub-apk
          path: telahub.apk
